spring.application.name=bank-case-management
spring.datasource.url=jdbc:postgresql://localhost:5432/css
spring.datasource.username=css
spring.datasource.password=css

# Flyway owns the schema (db/migration) and runs first; Hibernate only validates the entity against it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
